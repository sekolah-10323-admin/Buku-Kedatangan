<div id="root"></div>

  <p id="config-error" style="color:#B94A48; font-size:12px; margin:8px 0 0; display:none;"></p>
  <button id="config-save" style="width:100%; margin-top:12px; padding:12px 0; border-radius:10px; border:none; background:#16324F; color:#fff; font-weight:700; font-size:14px;">Save &amp; Connect</button>

<script type="module">
  // Dynamic imports (not static top-of-file ones) are used deliberately: a static
  // `import ... from` fails atomically if the CDN is unreachable, which prevents
  // ANY code in this module from running -- including the setup-screen logic below,
  // which doesn't even need Firebase yet. Dynamic import() can be wrapped in a real
  // try/catch, so a network hiccup shows a clear message instead of a blank page.

  const STORAGE_KEY = "kedatangan_fb_config";

  function extractConfigBlock(text) {
    const trimmed = text.trim();
    // Most people paste the whole snippet Firebase shows (imports, comments, the
    // "const firebaseConfig = {...}" line, and initializeApp/analytics calls) --
    // pull just the object literal out of that rather than requiring the bare
    // object on its own.
    const named = trimmed.match(/firebaseConfig\s*=\s*(\{[\s\S]*?\})\s*;/);
    if (named) return named[1];
    if (trimmed.startsWith("{")) return trimmed;
    const start = trimmed.indexOf("{");
    const end = trimmed.lastIndexOf("}");
    if (start !== -1 && end !== -1 && end > start) return trimmed.slice(start, end + 1);
    return trimmed;
  }

  function parseConfig(text) {
    // Accept both valid JSON and the raw JS-object-literal form Firebase shows in
    // its console (unquoted keys), by wrapping it so a Function constructor can
    // evaluate it as a plain object literal -- much more forgiving for a
    // copy-pasted snippet than requiring strict JSON.
    return Function('"use strict"; return (' + extractConfigBlock(text) + ")")();
  }

  function showSetup(errorMsg) {
    document.getElementById("root").style.display = "none";
    document.getElementById("setup-screen").style.display = "block";
    if (errorMsg) {
      const err = document.getElementById("config-error");
      err.textContent = errorMsg;
      err.style.display = "block";
    }
  }

  document.getElementById("config-save").addEventListener("click", () => {
    const text = document.getElementById("config-input").value.trim();
    try {
      const cfg = parseConfig(text);
      if (!cfg || !cfg.projectId) throw new Error("missing projectId");
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
      location.reload();
    } catch (e) {
      showSetup("That doesn't look like a valid config — please paste the whole firebaseConfig object exactly as shown in your Firebase project settings.");
    }
  });

  (async () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) {
      showSetup();
      return;
    }
    try {
      const config = JSON.parse(saved);
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js");
      const {
        getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc, query, where, writeBatch,
      } = await import("https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js");
      const app = initializeApp(config);
      const db = getFirestore(app);
      window.fs = { db, collection, doc, setDoc, getDoc, getDocs, deleteDoc, query, where, writeBatch };
      window.mountAttendanceApp();
    } catch (e) {
      showSetup("Couldn't connect (" + e.message + "). Check your configuration and internet connection, then try again.");
    }
  })();
</script>
